server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/engagement.log
module:
  name: engagement
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: false
entities:
  engagement_link_tracker:
    collection: engagement_link_trackers
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  engagement_link_tracker_click:
    collection: engagement_link_tracker_clicks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  engagement_campaign:
    collection: engagement_campaigns
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  engagement_source:
    collection: engagement_sources
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  engagement_medium:
    collection: engagement_media
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_badge:
    collection: gamification_badges
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_badge_user:
    collection: gamification_badge_users
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_karma_tracking:
    collection: gamification_karma_trackings
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_karma_rank:
    collection: gamification_karma_ranks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_challenge:
    collection: gamification_challenges
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_challenge_membership:
    collection: gamification_challenge_memberships
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_challenge_line:
    collection: gamification_challenge_lines
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_goal_definition:
    collection: gamification_goal_definitions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  gamification_goal:
    collection: gamification_goals
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  engagement_rating:
    collection: engagement_ratings
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090

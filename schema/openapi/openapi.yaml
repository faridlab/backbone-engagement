components:
  schemas:
    EngagementLinkTracker:
      type: object
      required:
        - id
        - url
        - code
        - label
        - metadata
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          maxLength: 2000
        code:
          type: string
          maxLength: 16
        title:
          nullable: true
          type: string
          maxLength: 300
        label:
          type: string
          maxLength: 40
        campaign_id:
          nullable: true
          type: string
          format: uuid
        medium_id:
          nullable: true
          type: string
          format: uuid
        source_id:
          nullable: true
          type: string
          format: uuid
        metadata:
          type: object

    EngagementLinkTrackerBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EngagementLinkTracker'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateEngagementLinkTrackerRequest:
      type: object
      required:
        - url
        - code
        - label
        - metadata
      properties:
        url:
          type: string
          maxLength: 2000
        code:
          type: string
          maxLength: 16
        title:
          nullable: true
          type: string
          maxLength: 300
        label:
          type: string
          maxLength: 40
        campaign_id:
          nullable: true
          type: string
          format: uuid
        medium_id:
          nullable: true
          type: string
          format: uuid
        source_id:
          nullable: true
          type: string
          format: uuid
        metadata:
          type: object

    UpdateEngagementLinkTrackerRequest:
      type: object
      required:
        - url
        - code
        - label
        - metadata
      properties:
        url:
          type: string
          maxLength: 2000
        code:
          type: string
          maxLength: 16
        title:
          nullable: true
          type: string
          maxLength: 300
        label:
          type: string
          maxLength: 40
        campaign_id:
          nullable: true
          type: string
          format: uuid
        medium_id:
          nullable: true
          type: string
          format: uuid
        source_id:
          nullable: true
          type: string
          format: uuid
        metadata:
          type: object

    PatchEngagementLinkTrackerRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2000
        code:
          type: string
          maxLength: 16
        title:
          nullable: true
          type: string
          maxLength: 300
        label:
          type: string
          maxLength: 40
        campaign_id:
          nullable: true
          type: string
          format: uuid
        medium_id:
          nullable: true
          type: string
          format: uuid
        source_id:
          nullable: true
          type: string
          format: uuid
        metadata:
          type: object


# =============================================================================
# engagement Module - Schema Index
# =============================================================================
# Version: 2.0
# Description: Module schema index. `module:` and `schema:` are stamped from
# the module name by `metaphor module create`. `schema:` gives this module its
# OWN Postgres schema (migrations emit `CREATE SCHEMA engagement` and qualify
# tables as `engagement.<table>`) — the convention every backbone module
# follows (see backbone-sapiens, backbone-bucket). Do not remove it.
# =============================================================================

module: engagement
version: 2
schema: engagement
description: "engagement — attribution (UTM masters + short-link tracker + click ledger), customer rating (the token-ferried 1..10 substrate), and gamification (karma ledger, badges, challenges, goals)"

# Company fence: none by design (ADR-0014 posture 4 — the ADR names
# utm/link_tracker's family explicitly; the Odoo engagement stack ships no
# company column and zero ir.rules). The module is tenant-agnostic (ADR-0029):
# no company RLS is emitted and none may be synthesized — a fence would change
# behavior, not just enforcement (do-not-synthesize). Tenant isolation
# (ADR-0006) remains the only fence; security is ACLs + service-layer checks.

config:
  database: postgresql
  soft_delete: true
  audit: true
  default_timestamps: true
  generators:
    disabled:
      - graphql
      - grpc
      - proto

# Reuse sapiens for user identity (actors) — logical refs, no DB constraint.
external_imports:
  - module: sapiens
    types: [User]

# Shared value-object types available to all models in this module.
shared_types:
  Timestamps:
    created_at:
      type: datetime
      attributes: ["@default(now)"]
      description: "Record creation timestamp"
    updated_at:
      type: datetime
      attributes: ["@updated_at"]
      description: "Last update timestamp"
    deleted_at:
      type: datetime?
      description: "Soft delete timestamp"

  Actors:
    created_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who created this record"
    updated_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who last updated this record"
    deleted_by:
      type: uuid?
      attributes: ["@foreign_key(sapiens.User.id)"]
      description: "User who deleted this record"

  Metadata: [Timestamps, Actors]

# Import each entity model (informational — discovery is a recursive glob,
# but keeping the list accurate helps readers).
imports:
  - utm-attribution.model.yaml
  - link-tracker.model.yaml
  - rating.model.yaml
  - gamification.model.yaml

# =============================================================================
# FLAG-ID COVERAGE — docs/odoo/foundation/engagement port (this module closes):
#
# utm (docs/odoo/foundation/engagement/_extraction_utm.md):
#   utm.campaign   → EngagementCampaign   utm-attribution.model.yaml
#   utm.source     → EngagementSource     utm-attribution.model.yaml
#   utm.medium     → EngagementMedium     utm-attribution.model.yaml
#   EN-20 cookie ferry       → engagement_write_service resolve_attribution
#                             (find-or-create seam the host calls; values are
#                             validated + length-capped BEFORE minting)
#   EN-22/EN-23 name engine  → engagement_write_service (unique-name counters,
#                             case-insensitive find-or-create grain)
#   EN-24 protected masters  → NOT ported as undeletable rows (no seed data in
#                             this release); hosts seed their protected set
#   EN-27 ACL shape          → guarded routes: reads + validated writes only
#   utm.stage/utm.tag        → deferred (kanban decoration; adding them later
#                             does not reshape the masters)
#   ir.http cookie planting  → HOST concern (the webapp plants odoo_utm_*
#                             cookies from URL params; this module materializes
#                             them via the resolve seam)
#
# link_tracker (docs/odoo/foundation/engagement/_extraction_link_tracker.md):
#   link.tracker       → EngagementLinkTracker        link-tracker.model.yaml
#   link.tracker.code  → collapsed INTO link_tracker.code (upstream keeps a
#                        single-code invariant — the inverse renames the row;
#                        the history table is Odoo-compat, not needed here)
#   link.tracker.click → EngagementLinkTrackerClick   link-tracker.model.yaml
#   EN-40 replayable clicks  → HARDENED: dedup key (link, ip, utc-day) unique
#                              + per-tracker click cap (see link-tracker.model.yaml)
#   EN-41 og:title fetch     → REMOVED (SSRF surface closed by decision):
#                              title is caller-supplied; previews render
#                              client-side (see README port notes)
#   EN-42 5-tuple uniqueness → write-path search_or_create with IS NOT DISTINCT
#                              FROM matching (kept out of SQL for the same
#                              NULL semantics upstream cites)
#   EN-43 code minting       → random [A-Za-z0-9] from length 3, length grows
#                              on collision (ported with the retry loop)
#   EN-44 UTM injection      → write service builds the redirect target
#                              (utm_campaign/source/medium from the tracker's
#                              masters); no_external_tracking ICP not ported —
#                              see README
#   EN-46 cookie-default leak→ tracker create takes UTMs only from its explicit
#                              input (there is no cookie default path here)
#   EN-47 input gates        → absolute http(s) targets only (also the
#                              no-open-redirect rule at /r/<code>); label ≤ 40
#   /r/<code> public 301     → ADR-0019 action_link-class guarded route:
#                              throttled, idempotent click minting (dedup key),
#                              302 (target edits must propagate — upstream's
#                              301 would freeze a rewritten target client-side)
#
# Out of scope by decision (later waves own them): utm.stage/tag,
# mail.render.mixin link rewriting (W6 mass mailing calls this module's
# search_or_create seam instead), portal rating surfaces (W7).
#
# rating + portal_rating (docs/odoo/foundation/engagement/_extraction_rating.md):
#   rating.rating        → EngagementRating              rating.model.yaml
#                         (house prefix vs the spec source's RatingRating —
#                         recorded naming delta D-25)
#   portal_rating trio   → publisher_comment/publisher_user_id/
#                         publisher_replied_at ON EngagementRating (the
#                         reply trio is typed-verb-written only)
#   EN-01/02/06 token    → REPLACED by a Tier A HMAC capability:
#                         token_nonce selector + mandatory token_expires_at,
#                         MAC over (id, nonce, grant, exp) recomputed at
#                         verify; rotation = rotate_token/reset (D-3)
#   EN-03 scale          → 1..10 integers (forced {1,3,5} dropped);
#                         bands top>=8/ok>=5/ko<=4 derived read-side (D-1)
#   EN-04/05 single-use  → submit is ONE conditional UPDATE; no anonymous
#                         re-submission/edit window; reset + re-solicit is
#                         the correction path (D-2)
#   EN-07/09 publish     → ONE publish rule: stats exposed ONLY through the
#                         guarded management composition this wave; no
#                         public/portal stats endpoint (D-4)
#   EN-08 parent rollup  → denormalized parent pair filled at issue from
#                         the rated-type registry's declared parent field
#   EN-10 ACL shape      → guarded routes: reads + typed verbs only
#   rating.mixin / parent.mixin / mail overlays → NOT entities: the stats
#                         engine is the write service's rating_stats read
#                         (one aggregated query + its parent-rollup twin)
#   DROPPED (D-19):      message_id, is_internal, rating_image*,
#                         resource_ref, res_model_id M2O, chatter cascade
#
# gamification (docs/odoo/foundation/engagement/_extraction_gamification.md):
#   gamification.badge        → GamificationBadge          gamification.model.yaml
#   gamification.badge.user   → GamificationBadgeUser      (grant_key partial
#                              UNIQUE = the exactly-once idempotency key,
#                              EN-86 + the survey certification contract)
#   gamification.karma.tracking→ GamificationKarmaTracking (append-only:
#                              UPDATE/DELETE refused by a DB trigger; balance
#                              = latest-row projection, never a sum — EN-60)
#   gamification.karma.rank   → GamificationKarmaRank      (karma_min > 0
#                              DB CHECK, EN-69; no seed data — D-24)
#   gamification.challenge    → GamificationChallenge      (machine #1,
#                              EN-S1; declarative membership — EN-81)
#   challenge line            → GamificationChallengeLine
#   (membership materialized) → GamificationChallengeMembership (the daily
#                              check reconciles it; leavers' goals CANCEL,
#                              never unlink — D-14)
#   gamification.goal.definition→ GamificationGoalDefinition (manual |
#                              registered_metric ONLY; metric_key validated
#                              against the builder-registered registry —
#                              EN-83, zero expression columns)
#   gamification.goal         → GamificationGoal            (machine #2,
#                              EN-S2; explicit first evaluation — EN-84;
#                              presence gate dropped — EN-82)
#   res.users karma overlay   → NOT ported (no karma column, no write
#                              interception — D-18); balance/rank/next-rank/
#                              completeness/gain are read projections
#   EN-62 consolidation cron  → NOT ported (history-rewrite ban — D-6)
#   EN-61 re-entrancy guard   → moot (nothing ever unlinks ledger rows)
#   EN-64 leaderboard         → ranks by the balance projection; the
#                              SUM-window leaderboards are dropped (D-5)
#   EN-66 admin bypass        → NOT ported (system grants are a keyed verb,
#                              not a bypassed ladder — D-11)
#   EN-68 goal_definition_ids → NOT ported (dead upstream; its help-text
#                              promise must not be implemented — D-13)
#   EN-83 eval surfaces       → BANNED (python/count/sum modes, domain,
#                              compute_code, batch_* columns all absent — D-8)
#   crons                     → ONE ports: gamification-daily-challenge-check
#                              (schema/hooks/index.hook.yaml); the
#                              consolidation cron does not port
# =============================================================================

# engagement Module - Hooks Index
# Version: 2.0
#
# Module-level configuration for hooks (lifecycle behaviors).
# Hooks define: state machines, rules, permissions, triggers, computed fields.
#
# No hook files yet: the ported surface (UTM masters + link tracker + click
# ledger) carries no state machines — invariants live in the hand-written
# write service (engagement_write_service) and the click dedup/cap rules.
# Rating/gamification (the cohort's machine-bearing addons) are later waves.

module: engagement
version: 2

# Import all hook files.
imports: []

# =============================================================================
# Module-level configuration
# =============================================================================
config:
  audit:
    retention_days: 365
    archive_after_days: 90
    critical_events: []

  notifications:
    email_enabled: false
    sms_enabled: false
    push_enabled: false

# =============================================================================
# Shared domain events
# =============================================================================
events: {}

# =============================================================================
# Scheduled jobs
# =============================================================================
scheduled_jobs: {}
